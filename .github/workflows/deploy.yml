name: deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Permissions required to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Helps avoid concurrent deployments
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Necessary for scanning the entire recent commit history

# 1. Immediate detection of secrets
      - name: Secret scanning
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

# 2. Dependency Audit (CVE)
      - name: Security audit
        run: pnpm audit --prod --audit-level=high

#3. Quality Controls and Build
      - name: Biome Lint & Format Check
        run: pnpm biome ci src

      - name: Build with Vite
        run: pnpm build

      # Upload the /dist folder generated by Vite
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # Deploy the artifact to Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5