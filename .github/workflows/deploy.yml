name: deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-and-build:
    name: Lint & Build Vanilla JS
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Installer pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.x

      - name: Configurer Node.js et le cache pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Contrôle qualité avec Biome
        run: pnpm biome ci src

      - name: Compiler avec Vite
        run: pnpm build