name: deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Permissions requises pour déployer sur GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permet d'éviter les déploiements concurrents
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.x

      - name: Install pnpm
        uses: pnpm/action-setup@v6.x
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7.x
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome Lint & Format Check
        run: pnpm biome ci src

      - name: Build with Vite
        run: pnpm build

      # Téléverse le dossier /dist généré par Vite
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # Déploie l'artefact sur Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5